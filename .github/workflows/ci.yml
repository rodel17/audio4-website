name: CI/CD

# Tests run on pushes to main and staging and on pull requests.
# Pushes to main that pass every test are deployed to production (the "deploy" job).
on:
  push:
    branches: [main, staging]
  pull_request:

# A newer push to the same branch cancels the run still in progress, except on main,
# where a deploy must never be interrupted halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: audio4
          POSTGRES_PASSWORD: audio4
          POSTGRES_DB: audio4_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audio4 -d audio4_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://audio4:audio4@localhost:5432/audio4_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check that every module compiles
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -W error::DeprecationWarning

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  docker:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        env:
          SITE_ADDRESS: ci.example.com
          POSTGRES_PASSWORD: ci
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.prod.yaml config -q
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rodel17/audio4-website'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and the site URL live in the "production" environment (Settings -> Environments).
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    # Deploys run one at a time, in order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key is restricted on the server to running scripts/deploy.sh only,
      # so no command is passed here.
      - name: Deploy on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          ssh -T -i ~/.ssh/deploy_key
          -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 -o ConnectTimeout=30
          "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for path in /api/health / /products /admin/login; do
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null \
              -w "$path -> %{http_code} in %{time_total}s\n" "$SITE_URL$path"
          done
